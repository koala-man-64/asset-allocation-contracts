name: contracts-security-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: "0 8 * * 1"
    displayName: Weekly contracts security scan
    branches:
      include:
        - main
    always: true

pool:
  name: local-docker-agents
  demands:
    - Agent.OS -equals Linux
    - CONTRACTS_TOOLCHAIN -equals true
    - CONTRACTS_PYTHON -equals 3.14
    - CONTRACTS_NODE -equals 20
    - CONTRACTS_PNPM -equals 10.28.1

variables:
  NODE_VERSION: "20.x"
  PNPM_VERSION: "10.28.1"
  PYTHON_VERSION: "3.14"

stages:
  - stage: Security
    displayName: Security scans
    jobs:
      - job: PythonAudit
        displayName: Python dependency audit
        steps:
          - checkout: self

          - template: templates/contracts-toolchain-preflight.yml

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              python -m pip install pip-audit==2.10.0
              mkdir -p artifacts
              python - <<'PY' > artifacts/python-audit-requirements.txt
              import tomllib
              from pathlib import Path
              pyproject = tomllib.loads(Path("python/pyproject.toml").read_text(encoding="utf-8"))
              print("\n".join(pyproject["project"]["dependencies"]))
              PY
              python -m pip_audit --format json -r artifacts/python-audit-requirements.txt -o artifacts/pip-audit.json || audit_status=$?
              python -m pip_audit --strict -r artifacts/python-audit-requirements.txt
            displayName: Run pip-audit

          - publish: artifacts
            artifact: contracts-security-python
            condition: always()

      - job: TypeScriptAudit
        displayName: TypeScript dependency audit
        steps:
          - checkout: self

          - template: templates/contracts-toolchain-preflight.yml

          - task: npmAuthenticate@0
            inputs:
              workingFile: ts/.npmrc

          - script: |
              set -euo pipefail
              mkdir -p ../artifacts/ts
              pnpm install --frozen-lockfile
              pnpm audit --json > ../artifacts/ts/pnpm-audit.json || true
              pnpm audit --audit-level=high
            workingDirectory: ts
            displayName: Run pnpm audit

          - publish: artifacts/ts
            artifact: contracts-security-ts
            condition: always()
